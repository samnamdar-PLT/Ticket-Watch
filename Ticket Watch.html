<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On Sale — Event Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121214;
    --card:#1c1c20;
    --card-hover:#212126;
    --hairline:#302f34;
    --dash:#3c3b41;
    --text:#eae7e0;
    --muted:#8f8d92;
    --amber:#f2c14e;
    --teal:#4fc8bf;
    --coral:#ff6b6a;
    --today:#e8543f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--amber);color:#121214;}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--bg) 80%,rgba(18,18,20,0));
    padding:28px 24px 14px;
    border-bottom:1px solid var(--hairline);
  }
  .header-inner{max-width:920px;margin:0 auto;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--amber);margin:0 0 4px;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:44px;letter-spacing:.03em;
    margin:0 0 14px;line-height:1;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  }
  h1 span.count{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;color:var(--muted);letter-spacing:0;
  }
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;}
  .search-wrap{position:relative;flex:1 1 240px;min-width:180px;}
  .search-wrap input{
    width:100%;
    background:var(--card);
    border:1px solid var(--hairline);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:10px 12px 10px 34px;
    border-radius:8px;
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--amber);}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13px;font-weight:600;
    padding:10px 14px;border-radius:8px;
    border:1px solid var(--hairline);
    background:var(--card);color:var(--text);
    cursor:pointer;white-space:nowrap;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn:hover{border-color:var(--muted);background:var(--card-hover);}
  .btn.primary{background:var(--amber);color:#151310;border-color:var(--amber);}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;}
  input[type=file]{display:none;}
  .meta-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;color:var(--muted);
    margin-top:10px;
  }

  /* ---------- Body / list ---------- */
  main{max-width:920px;margin:0 auto;padding:22px 24px 80px;}

  .day-heading{
    position:sticky;top:132px;z-index:10;
    background:var(--bg);
    font-family:'Bebas Neue',sans-serif;
    font-size:22px;letter-spacing:.02em;
    color:var(--text);
    padding:14px 0 8px;
    display:flex;align-items:center;gap:10px;
  }
  .day-heading .tag-today{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    background:var(--today);color:#fff;
    padding:3px 7px;border-radius:4px;
    transform:translateY(-1px);
  }

  .ticket{
    position:relative;
    display:flex;
    background:var(--card);
    border:1px solid var(--hairline);
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden;
    transition:border-color .15s ease;
  }
  .ticket:hover{border-color:#4a4950;}

  .ticket-info{
    flex:1 1 auto;
    min-width:0;
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:5px;
    justify-content:center;
  }
  .ev-name{
    font-size:16px;font-weight:700;color:var(--text);
    line-height:1.3;
  }
  .ev-venue{
    font-size:13.5px;color:var(--muted);
    line-height:1.3;
  }
  .ev-time{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--amber);
    letter-spacing:.02em;
  }

  .perf{
    position:relative;
    width:0;
    border-left:2px dashed var(--dash);
    flex:0 0 auto;
  }
  .perf::before,.perf::after{
    content:"";
    position:absolute;left:50%;
    width:16px;height:16px;
    background:var(--bg);
    border-radius:50%;
    transform:translateX(-50%);
  }
  .perf::before{top:-9px;}
  .perf::after{bottom:-9px;}

  .ticket-actions{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:14px;
    justify-content:center;
    min-width:150px;
  }
  .link-btn{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;
    font-family:'Inter',sans-serif;
    font-size:12.5px;font-weight:600;
    text-decoration:none;
    padding:8px 10px;
    border-radius:6px;
    border:1px solid transparent;
    color:#141316;
    transition:filter .15s ease, transform .1s ease;
  }
  .link-btn:hover{filter:brightness(1.1);}
  .link-btn:active{transform:scale(.98);}
  .link-btn.primary-site{background:var(--amber);}
  .link-btn.vivid{background:var(--teal);}
  .link-btn.stub{background:var(--coral);}
  .link-btn svg{flex:0 0 auto;opacity:.75;}
  .link-btn.disabled{
    background:transparent;
    border:1px dashed var(--hairline);
    color:var(--muted);
    cursor:default;
    pointer-events:none;
  }

  /* ---------- Empty state ---------- */
  .empty{
    max-width:520px;margin:80px auto;text-align:center;
    padding:0 24px;
  }
  .empty .ticket-icon{font-size:40px;margin-bottom:14px;}
  .empty h2{
    font-family:'Bebas Neue',sans-serif;font-size:30px;
    margin:0 0 8px;letter-spacing:.02em;
  }
  .empty p{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 20px;}
  .drop-zone{
    border:1.5px dashed var(--hairline);
    border-radius:12px;
    padding:34px 20px;
    color:var(--muted);
    font-size:13.5px;
    transition:border-color .15s ease, background .15s ease;
  }
  .drop-zone.drag{border-color:var(--amber);background:rgba(242,193,78,.05);}

  .no-results{color:var(--muted);font-size:14px;padding:40px 0;text-align:center;}

  @media (max-width:560px){
    h1{font-size:34px;}
    .ticket{flex-direction:column;}
    .perf{border-left:none;border-top:2px dashed var(--dash);width:auto;height:0;}
    .perf::before{top:auto;left:-9px;bottom:-9px;}
    .perf::after{left:auto;right:-9px;bottom:-9px;top:auto;}
    .ticket-actions{flex-direction:row;flex-wrap:wrap;min-width:0;}
    .link-btn{flex:1 1 30%;}
    .day-heading{top:158px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <p class="eyebrow">Ticket Watch</p>
    <h1>On The Marquee <span class="count" id="countLabel"></span></h1>
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search event or venue…">
      </div>
      <button class="btn primary" id="uploadBtn">Upload CSV</button>
      <button class="btn ghost" id="clearBtn" style="display:none;">Clear data</button>
      <input type="file" id="fileInput" accept=".csv">
    </div>
    <p class="meta-line" id="metaLine"></p>
  </div>
</header>

<main id="main">
  <div class="empty" id="emptyState">
    <div class="ticket-icon">🎟️</div>
    <h2>No events loaded yet</h2>
    <p>Upload the CSV — same format every time — and it'll stay saved here for next time you open this page.</p>
    <div class="drop-zone" id="dropZone">Drag a CSV here, or use the Upload CSV button above</div>
  </div>
  <div id="listRoot"></div>
</main>

<script>
const STORAGE_KEY = 'events:data';
const META_KEY = 'events:meta';

const $ = sel => document.querySelector(sel);
const fileInput = $('#fileInput');
const uploadBtn = $('#uploadBtn');
const clearBtn = $('#clearBtn');
const dropZone = $('#dropZone');
const emptyState = $('#emptyState');
const listRoot = $('#listRoot');
const searchInput = $('#searchInput');
const countLabel = $('#countLabel');
const metaLine = $('#metaLine');

let allEvents = [];

// ---------- CSV parsing ----------
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.length > 1 || (r[0] && r[0].trim())).map(r => {
    const obj = {};
    headers.forEach((h,idx) => obj[h] = (r[idx] !== undefined ? r[idx].trim() : ''));
    return obj;
  });
}

function parseEventDate(str){
  if(!str) return null;
  // e.g. "Mon, August 17, 2026at 11:00 AM"
  const m = str.match(/([A-Za-z]+),?\s+([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})\s*at\s+(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m) return null;
  const [, , monthName, day, year, hour, minute, ampm] = m;
  const months = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  const monthIdx = months.indexOf(monthName.toLowerCase());
  if(monthIdx === -1) return null;
  let h = parseInt(hour,10);
  if(ampm.toUpperCase() === 'PM' && h !== 12) h += 12;
  if(ampm.toUpperCase() === 'AM' && h === 12) h = 0;
  return new Date(parseInt(year,10), monthIdx, parseInt(day,10), h, parseInt(minute,10));
}

function siteLabel(site){
  if(!site) return 'Tickets';
  const s = site.trim().toLowerCase();
  if(s === 'ticketmaster') return 'Ticketmaster';
  if(s === 'axs') return 'AXS';
  return site.charAt(0).toUpperCase() + site.slice(1);
}

function recordsFromCSV(text){
  const rows = parseCSV(text);
  return rows.map(r => {
    const dateObj = parseEventDate(r['Date'] || '');
    return {
      name: r['Event Name'] || 'Untitled event',
      venue: r['Venue'] || '',
      dateStr: r['Date'] || '',
      dateObj: dateObj ? dateObj.toISOString() : null,
      primarySite: r['Primary Site'] || '',
      primaryLink: r['Primary Link'] || '',
      vividLink: r['VividSeats Link'] || '',
      stubLink: r['StubHub Link'] || ''
    };
  }).filter(r => r.name && r.name !== 'Untitled event' || r.dateObj);
}

// ---------- Storage ----------
async function loadEvents(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      allEvents = JSON.parse(res.value);
    }
  }catch(e){ allEvents = []; }
  try{
    const meta = await window.storage.get(META_KEY, false);
    if(meta && meta.value){
      const m = JSON.parse(meta.value);
      metaLine.textContent = `Loaded ${m.count} events · updated ${new Date(m.uploadedAt).toLocaleString()}`;
    }
  }catch(e){ metaLine.textContent = ''; }
  render();
}

async function saveEvents(events){
  allEvents = events;
  await window.storage.set(STORAGE_KEY, JSON.stringify(events), false);
  const meta = { count: events.length, uploadedAt: new Date().toISOString() };
  await window.storage.set(META_KEY, JSON.stringify(meta), false);
  metaLine.textContent = `Loaded ${meta.count} events · updated ${new Date(meta.uploadedAt).toLocaleString()}`;
  render();
}

async function clearEvents(){
  try{ await window.storage.delete(STORAGE_KEY, false); }catch(e){}
  try{ await window.storage.delete(META_KEY, false); }catch(e){}
  allEvents = [];
  metaLine.textContent = '';
  render();
}

// ---------- Rendering ----------
function linkBtn(href, label, cls){
  if(!href){
    return `<span class="link-btn disabled">${label}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>`;
  }
  return `<a class="link-btn ${cls}" href="${encodeURI(href)}" target="_blank" rel="noopener noreferrer">${label}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M7 7h10v10"/></svg></a>`;
}

function dayKey(dateObj){
  if(!dateObj) return 'Date TBD';
  const d = new Date(dateObj);
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}

function isSameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function render(){
  const query = searchInput.value.trim().toLowerCase();
  const hasData = allEvents.length > 0;
  emptyState.style.display = hasData ? 'none' : 'block';
  clearBtn.style.display = hasData ? 'inline-block' : 'none';

  if(!hasData){
    listRoot.innerHTML = '';
    countLabel.textContent = '';
    return;
  }

  let filtered = allEvents.filter(ev => {
    if(!query) return true;
    return ev.name.toLowerCase().includes(query) || ev.venue.toLowerCase().includes(query);
  });

  countLabel.textContent = `${filtered.length} of ${allEvents.length}`;

  const withDate = filtered.filter(e => e.dateObj).sort((a,b) => new Date(a.dateObj) - new Date(b.dateObj));
  const withoutDate = filtered.filter(e => !e.dateObj);

  const groups = [];
  let currentKey = null, currentGroup = null;
  withDate.forEach(ev => {
    const key = dayKey(ev.dateObj);
    if(key !== currentKey){
      currentKey = key;
      currentGroup = { key, events: [] };
      groups.push(currentGroup);
    }
    currentGroup.events.push(ev);
  });
  if(withoutDate.length){
    groups.push({ key: 'Date TBD', events: withoutDate });
  }

  if(!groups.length){
    listRoot.innerHTML = '<div class="no-results">No events match your search.</div>';
    return;
  }

  const now = new Date();
  listRoot.innerHTML = groups.map(g => {
    const firstEv = g.events[0];
    const isToday = firstEv.dateObj && isSameDay(new Date(firstEv.dateObj), now);
    const heading = `<div class="day-heading">${g.key}${isToday ? '<span class="tag-today">Today</span>' : ''}</div>`;
    const tickets = g.events.map(ev => {
      const time = ev.dateObj ? new Date(ev.dateObj).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) : '';
      return `
        <div class="ticket">
          <div class="ticket-info">
            <div class="ev-name">${escapeHtml(ev.name)}</div>
            <div class="ev-venue">${escapeHtml(ev.venue)}</div>
            ${time ? `<div class="ev-time">${time}</div>` : ''}
          </div>
          <div class="perf"></div>
          <div class="ticket-actions">
            ${linkBtn(ev.primaryLink, siteLabel(ev.primarySite), 'primary-site')}
            ${linkBtn(ev.vividLink, 'VividSeats', 'vivid')}
            ${linkBtn(ev.stubLink, 'StubHub', 'stub')}
          </div>
        </div>`;
    }).join('');
    return heading + tickets;
  }).join('');
}

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- Events ----------
uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const records = recordsFromCSV(ev.target.result);
    saveEvents(records);
  };
  reader.readAsText(file);
  fileInput.value = '';
});

clearBtn.addEventListener('click', () => {
  if(confirm('Clear all saved events?')) clearEvents();
});

searchInput.addEventListener('input', render);

['dragenter','dragover'].forEach(evt => {
  document.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('drag'); });
});
['dragleave','drop'].forEach(evt => {
  document.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.remove('drag'); });
});
document.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const records = recordsFromCSV(ev.target.result);
    saveEvents(records);
  };
  reader.readAsText(file);
});

loadEvents();
</script>
</body>
</html>
